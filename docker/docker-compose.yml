version: '3.8'

services:
  churn-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: churn-intelligence-ui
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    volumes:
      - ../models:/app/models
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  churn-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: churn-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
